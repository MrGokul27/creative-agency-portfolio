<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found - Stackly Creative Agency</title>
    <link
      rel="icon"
      type="image/webp"
      href="../assets/images/logoStackly.webp"
    />

    <!-- Google Fonts (Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome 6.6.0 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- Main Stylesheet & 404 Specific CSS -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/404.css" />
  </head>
  <body class="error-page-body">
    <!-- MAIN 404 HERO CANVAS SECTION -->
    <section class="error-hero-section">
      <!-- Ambient Glow Orbs -->
      <div class="error-ambient-orb error-orb-1"></div>
      <div class="error-ambient-orb error-orb-2"></div>
      <div class="error-ambient-orb error-orb-3"></div>
      <div class="error-grid-overlay"></div>

      <div class="container position-relative z-2 text-center">
        <!-- Error Status Badge -->
        <div>
          <div class="error-status-badge">
            <span class="error-pulse-dot"></span>
            <span>Error Code : 404_CANVAS_NOT_FOUND</span>
          </div>
        </div>

        <!-- Giant 404 Visual Display with Floating Chips -->
        <div class="error-404-visual-container">
          <div class="error-floating-chip chip-left d-none d-sm-flex">
            <i class="fa-solid fa-compass-drafting"></i>
            <span>Lost in Pixels</span>
          </div>
          <h1 class="error-404-big-number">404</h1>
          <div class="error-floating-chip chip-right d-none d-sm-flex">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>0% Pixels Rendered</span>
          </div>
        </div>

        <!-- Headline & Description -->
        <h2 class="error-title">
          Lost in the <span class="text-gradient">Creative Matrix</span>
        </h2>
        <p class="error-description">
          The digital canvas, page, or case study you're attempting to reach has
          drifted into the void, been relocated, or never existed in our studio
          universe.
        </p>

        <!-- Redirection & Navigation Action Buttons -->
        <div class="error-actions-wrapper">
          <!-- 1. Home Page Redirection Button -->
          <a href="../index.html" class="btn-creative-primary btn-404-hero">
            <i class="fa-solid fa-house"></i>
            <span>Back to Homepage</span>
            <i class="fa-solid fa-arrow-right"></i>
          </a>

          <!-- 2. Go Back Button -->
          <button
            type="button"
            onclick="handleGoBack()"
            class="btn-creative-outline btn-404-hero"
          >
            <i class="fa-solid fa-arrow-left"></i>
            <span>Go Back</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main Interactive Script with Component Loader -->
    <script src="../assets/js/script.js"></script>

    <!-- 404 Specific Interactive Features -->
    <script>
      // 1. Intelligent Go Back Handler
      function handleGoBack() {
        if (
          window.history.length > 1 &&
          document.referrer &&
          !document.referrer.includes("404.html")
        ) {
          window.history.back();
        } else {
          window.location.href = "../index.html";
        }
      }

      // 2. Interactive Search & Instant Navigation
      document.addEventListener("DOMContentLoaded", () => {
        const searchInput = document.getElementById("errorSearchInput");
        const searchBtn = document.getElementById("errorSearchBtn");
        const dropdown = document.getElementById("searchResultsDropdown");

        const siteIndex = [
          {
            title: "Home Page",
            url: "../index.html",
            icon: "fa-house",
            badge: "Main",
            keywords: "home main landing index start welcome",
          },
          {
            title: "About Us & Story",
            url: "about.html",
            icon: "fa-building",
            badge: "Agency",
            keywords:
              "about agency story manifesto principles awards mission vision",
          },
          {
            title: "Creative Services",
            url: "services.html",
            icon: "fa-laptop-code",
            badge: "Services",
            keywords:
              "services web design development branding ui ux 3d motion mobile apps marketing seo",
          },
          {
            title: "Portfolio & Works",
            url: "portfolio.html",
            icon: "fa-layer-group",
            badge: "Projects",
            keywords: "portfolio works case studies projects clients showcase",
          },
          {
            title: "Our Team & Directors",
            url: "team.html",
            icon: "fa-users",
            badge: "Team",
            keywords:
              "team leadership designers developers creative directors founders",
          },
          {
            title: "Insights & Articles",
            url: "blog.html",
            icon: "fa-newspaper",
            badge: "Blog",
            keywords: "blog articles news insights trends design tech agency",
          },
          {
            title: "Contact & Inquiries",
            url: "contact.html",
            icon: "fa-envelope",
            badge: "Contact",
            keywords: "contact support quote hire location address email phone",
          },
          {
            title: "Client Portal Login",
            url: "login.html",
            icon: "fa-user-lock",
            badge: "Auth",
            keywords: "login signin account portal auth client",
          },
          {
            title: "Create Client Account",
            url: "register.html",
            icon: "fa-user-plus",
            badge: "Auth",
            keywords: "register signup create account onboarding",
          },
        ];

        function performSearch(query) {
          if (!query || query.trim().length === 0) {
            dropdown.style.display = "none";
            dropdown.innerHTML = "";
            return;
          }

          const q = query.toLowerCase().trim();
          const matches = siteIndex.filter(
            (item) =>
              item.title.toLowerCase().includes(q) ||
              item.keywords.toLowerCase().includes(q) ||
              item.badge.toLowerCase().includes(q),
          );

          if (matches.length > 0) {
            dropdown.innerHTML = matches
              .map(
                (item) => `
              <a href="${item.url}" class="search-result-item">
                <div>
                  <i class="fa-solid ${item.icon}"></i>
                  <span>${item.title}</span>
                </div>
                <span class="search-result-badge">${item.badge}</span>
              </a>
            `,
              )
              .join("");
            dropdown.style.display = "block";
          } else {
            dropdown.innerHTML = `
              <div class="px-3 py-2 text-white-50 small">
                <i class="fa-solid fa-circle-question me-2"></i> No direct page match found. Try "services", "portfolio", or "contact".
              </div>
            `;
            dropdown.style.display = "block";
          }
        }

        if (searchInput) {
          searchInput.addEventListener("input", (e) => {
            performSearch(e.target.value);
          });

          searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              const firstMatch = dropdown.querySelector(".search-result-item");
              if (firstMatch) {
                window.location.href = firstMatch.getAttribute("href");
              } else if (searchInput.value.trim().length > 0) {
                window.location.href = "services.html";
              }
            }
          });
        }

        if (searchBtn) {
          searchBtn.addEventListener("click", () => {
            const firstMatch = dropdown.querySelector(".search-result-item");
            if (firstMatch) {
              window.location.href = firstMatch.getAttribute("href");
            } else {
              window.location.href = "services.html";
            }
          });
        }

        // Close search suggestions on outside click
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".error-search-box-container") && dropdown) {
            dropdown.style.display = "none";
          }
        });
      });
    </script>
  </body>
</html>
